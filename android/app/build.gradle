apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
    // Hermes and New Architecture are controlled by gradle.properties
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.localaiassistant"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.localaiassistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_TOOLCHAIN=clang",
                          "-DLLAMA_NATIVE=OFF"
                cppFlags "-std=c++17 -O3 -fPIC -pthread"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            def defaultDebugKeystore = file("${System.properties['user.home']}/.android/debug.keystore")
            storeFile defaultDebugKeystore.exists() ? defaultDebugKeystore : rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['STORE_FILE'] ?: 'release.keystore')
                storePassword keystoreProperties['STORE_PASSWORD'] ?: ''
                keyAlias keystoreProperties['KEY_ALIAS'] ?: ''
                keyPassword keystoreProperties['KEY_PASSWORD'] ?: ''
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libllama.so'
    }

    // Bundle GGUF models from project models/ directory as Android assets
    sourceSets {
        main {
            assets.srcDirs += ['../../models']
        }
    }

    // Disable compression for large model files to allow direct memory mapping
    aaptOptions {
        noCompress 'gguf'
    }

}

def jscFlavor = 'org.webkit:android-jsc:+'

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation(jscFlavor)
    }

    // AndroidX
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // SQLite
    implementation "androidx.sqlite:sqlite:2.4.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.14.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

// Autolinking is handled by the @react-native/gradle-plugin (RN 0.76+)
